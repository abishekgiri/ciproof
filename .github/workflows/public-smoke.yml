name: Public package smoke

# Manually verify a PUBLISHED version from the public npm registry across OSes.
# This installs ciproof from npm — it never uses the repository build output — and
# publishes nothing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to smoke-test (e.g. 0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke-test the public package
        run: node scripts/smoke-public-package.mjs "${{ inputs.version }}"
