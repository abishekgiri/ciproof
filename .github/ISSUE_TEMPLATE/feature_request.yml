name: Feature / semantics request
description: Request support for a GitHub Actions feature CIProof does not model, or another capability.
title: "[request]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Specific, workflow-grounded requests are far more actionable than generic ones."
  - type: input
    id: feature
    attributes:
      label: Which GitHub Actions feature is currently unsupported?
      placeholder: "e.g. reusable workflow from another repository"
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: How does it affect your workflow?
      description: What can't you verify today because of it?
    validations:
      required: true
  - type: dropdown
    id: unknown
    attributes:
      label: Does CIProof currently return UNKNOWN for it?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Public or minimal workflow demonstrating the feature
      render: yaml
