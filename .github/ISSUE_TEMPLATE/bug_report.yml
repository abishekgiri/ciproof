name: Bug report
description: A defect in CIProof that is not a false counterexample or an UNKNOWN question.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "**Remove secrets before sharing any workflow, config, or output.**"
  - type: input
    id: version
    attributes:
      label: CIProof version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 14 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "22.x"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - "npx ciproof"
        - "npm install --save-dev ciproof"
        - "other"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command run
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      render: yaml
    validations:
      required: true
