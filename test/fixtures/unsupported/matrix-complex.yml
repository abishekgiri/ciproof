# Purpose: a build matrix with include/exclude.
# UNSUPPORTED: complex matrix expansion is out of v0.1 scope; job multiplicity
# must surface as UNKNOWN rather than a single modeled job.
name: unsupported-matrix
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
        os: [ubuntu-latest, macos-latest]
        include:
          - node: 22
            os: ubuntu-latest
            experimental: true
        exclude:
          - node: 18
            os: macos-latest
    steps:
      - run: echo "build ${{ matrix.node }} ${{ matrix.os }}"
